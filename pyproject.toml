[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commitgen"
version = "0.1.0"
description = "AI-generated git commit messages and changelogs, powered by Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.34.0",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.scripts]
commitgen = "commitgen.cli:main"

[tool.setuptools.packages.find]
include = ["commitgen*"]
